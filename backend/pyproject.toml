[tool.poetry]
name = "kizuna-backend"
version = "0.1.0"
description = "Sermon AI Translation API"
authors = ["Admin"]

[tool.poetry.dependencies]
# --- CORE FRAMEWORK ---
python = "^3.14"
fastapi = "0.143.2"
uvicorn = {extras = ["standard"], version = "0.54.0"}
sqlalchemy = "2.0.50"
asyncpg = "0.31.0"

# --- PRODUCTION SERVER ---
gunicorn = "^23.0.0"
uvicorn-worker = "^0.4.0"

# --- SECURITY & AUTH ---
bcrypt = "^5.0.0"
pyjwt = "^2.15.1"
email-validator = "^2.1.0"

# --- TRANSLATION & UTILS ---
azure-cognitiveservices-speech = "1.50.0"
qrcode = "8.2"
pillow = "13.0.0"   # Required for generating QR images
requests = "2.34.2" # Standard HTTP client
httpx = "^0.28.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
