services:
  # 1. THE DATABASE (PostgreSQL)
  db:
    image: postgres:15-alpine
    container_name: kizuna_db
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}
      - POSTGRES_DB=${POSTGRES_DB:-kizuna_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # $$ escapes the dollar sign, so the container's own shell expands its
      # POSTGRES_* environment instead of Compose interpolating from .env.
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. THE BACKEND (FastAPI)
  backend:
    build: ./backend
    container_name: kizuna_backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
    environment:
      # The Connection String: postgresql+asyncpg://USER:PASS@HOST:PORT/DB_NAME
      # Host is 'db' (the service name above), not 'localhost'. The defaults
      # match the db service so the stack boots even without a .env file.
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-kizuna_db}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.8-flash}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - KIZUNA_DEBUG_DIAGNOSTICS=${KIZUNA_DEBUG_DIAGNOSTICS:-}

  # 3. THE FRONTEND (Vite React dev server)
  frontend:
    build: ./frontend
    container_name: kizuna_frontend
    environment:
      # Inside the container, the backend is reachable by service name. Vite
      # proxies /api and /ws to it, so the browser (including phones on the
      # LAN) only ever talks to this one origin: http://<host>:5173.
      - VITE_BACKEND_PROXY_TARGET=http://backend:8000
      - WATCHPACK_POLLING=true
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

  # 4. THE TUNNEL (ngrok) — optional, for phone testing over cellular.
  # It is opt-in (profile), so a plain `docker compose up -d` never exposes a
  # public URL. Requires NGROK_AUTHTOKEN in .env. Start it with:
  #   docker compose --profile ngrok up -d
  ngrok:
    image: ngrok/ngrok:latest
    container_name: kizuna_ngrok
    restart: unless-stopped
    profiles: ["ngrok"]
    # Tunnel the frontend; Vite proxies /api and /ws to the backend for us,
    # so the ngrok URL is a fully working app on its own.
    command: http frontend:5173 --log stdout
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    ports:
      - "127.0.0.1:4040:4040" # ngrok's request inspector, laptop-only
    depends_on:
      - frontend

volumes:
  postgres_data:
